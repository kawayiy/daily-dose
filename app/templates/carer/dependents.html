{% extends "base.html" %}
{% block title %}My Dependents{% endblock %}
{% block content %}
<h2>My Dependents</h2>

<p>
  <a href="{{ url_for('carer.dependents_add') }}">Link a dependent</a>
</p>

{% if dependents %}
  <ul>
    {% for u in dependents %}
      <li style="margin-bottom: 10px;">
        <strong>{{ u.name }}</strong> <span style="color:#6b7280;">({{ u.email }})</span>
        <form method="post" action="{{ url_for('carer.dependents_remove', dependent_id=u.id) }}" style="display:inline;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Remove</button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p style="color:#6b7280;">No dependents linked yet.</p>
{% endif %}
{% endblock %}
